<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor VoIP — Telefones ALE</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a;
    --text: #e6e9ef; --muted: #8b93a7; --accent: #4f8cff; --ok: #2ecc71;
    --bad: #e74c3c; --warn: #f1c40f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 22px; background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10;
  }
  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  h1 span { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 8px; }
  .spacer { flex: 1; }
  .lastcheck {
    display: flex; flex-direction: column; align-items: flex-end; line-height: 1.25;
    padding-right: 4px; margin-right: 6px;
  }
  .lc-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
  .lc-value { font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #msg { color: var(--muted); font-size: 12.5px; margin-right: 10px; }

  /* ---- barra de status do monitoramento ---- */
  .statusbar {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    margin: 14px 22px 0; padding: 12px 16px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel2);
    animation: slidein .18s ease;
  }
  @keyframes slidein { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .statusbar[hidden] { display: none; }
  .sb-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .sb-text { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; }
  .sb-text strong { font-size: 14px; }
  .sb-text span { font-size: 12.5px; color: var(--muted); }
  .sb-icon { width: 18px; height: 18px; flex: none; border-radius: 50%; }
  .sb-close {
    background: transparent; border: 0; color: var(--muted); font-size: 20px;
    line-height: 1; padding: 0 4px; cursor: pointer;
  }
  .sb-close:hover { color: var(--text); }

  .statusbar.running { border-color: rgba(79,140,255,.55); background: rgba(79,140,255,.10); }
  .statusbar.running .sb-icon { border: 2px solid rgba(79,140,255,.35); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  .statusbar.running strong { color: var(--accent); }

  .statusbar.ok { border-color: rgba(46,204,113,.5); background: rgba(46,204,113,.10); }
  .statusbar.ok .sb-icon { background: var(--ok); }
  .statusbar.ok .sb-icon::after { content: '✓'; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #06210f; font-weight: 800; height: 100%; }
  .statusbar.ok strong { color: var(--ok); }

  .statusbar.warn { border-color: rgba(241,196,15,.5); background: rgba(241,196,15,.10); }
  .statusbar.warn .sb-icon { background: var(--warn); }
  .statusbar.warn .sb-icon::after { content: '!'; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #2a2200; font-weight: 800; height: 100%; }
  .statusbar.warn strong { color: var(--warn); }

  .statusbar.err { border-color: rgba(231,76,60,.6); background: rgba(231,76,60,.12); }
  .statusbar.err .sb-icon { background: var(--bad); }
  .statusbar.err .sb-icon::after { content: '×'; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff; font-weight: 800; height: 100%; }
  .statusbar.err strong { color: #ff8b7e; }

  /* ---- botão ---- */
  #btnMonitor { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 210px; }
  .btn-spinner {
    width: 13px; height: 13px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.35); border-top-color: #fff;
    animation: spin .7s linear infinite;
  }
  .btn-spinner[hidden] { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #btnMonitor.running { background: #35507f; cursor: progress; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; padding: 18px 22px 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card .n { font-size: 26px; font-weight: 650; letter-spacing: -.5px; }
  .card .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .card.ok .n { color: var(--ok); }
  .card.bad .n { color: var(--bad); }
  .controls { display: flex; gap: 10px; padding: 18px 22px; flex-wrap: wrap; align-items: center; }
  input[type=search], select {
    background: var(--panel2); border: 1px solid var(--line); color: var(--text);
    padding: 9px 12px; border-radius: 8px; font-size: 14px; outline: none;
  }
  input[type=search] { min-width: 280px; }
  input[type=search]:focus, select:focus { border-color: var(--accent); }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 9px 16px; font-size: 14px; font-weight: 550; cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .wrap { padding: 0 22px 40px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 10px; overflow: hidden; }
  th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th {
    background: var(--panel2); color: var(--muted); font-size: 11.5px; text-transform: uppercase;
    letter-spacing: .05em; cursor: pointer; user-select: none;
  }
  th:hover { color: var(--text); }
  th .arw { opacity: .5; font-size: 10px; }
  tbody tr:hover { background: #1b1f28; }
  tbody tr { cursor: pointer; }
  .ramal { font-weight: 650; color: var(--accent); font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; }
  .dot.on { background: var(--ok); box-shadow: 0 0 7px var(--ok); }
  .dot.off { background: var(--bad); box-shadow: 0 0 7px rgba(231,76,60,.6); }
  .dot.unk { background: var(--muted); }
  .st-missing { color: var(--bad); font-weight: 600; }
  .badge-queda {
    display: inline-block; background: rgba(231,76,60,.15); border: 1px solid rgba(231,76,60,.45);
    color: #ff8b7e; border-radius: 20px; padding: 1px 8px; font-size: 12px; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .card.warn .n { color: var(--warn); }
  .setor-cell { max-width: 300px; white-space: normal; }
  .setor-tag {
    display: inline-block; background: var(--panel2); border: 1px solid var(--line);
    color: var(--muted); border-radius: 5px; padding: 1px 7px; font-size: 12px;
    margin: 1px 3px 1px 0;
  }
  .mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12.5px; }
  td.serial { max-width: 130px; overflow: hidden; text-overflow: ellipsis; }
  .muted { color: var(--muted); }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11.5px;
    background: var(--panel2); border: 1px solid var(--line); color: var(--muted);
  }
  #msg { color: var(--muted); font-size: 13px; }
  #drawer {
    position: fixed; inset: 0 0 0 auto; width: min(600px, 92vw); background: var(--panel);
    border-left: 1px solid var(--line); padding: 22px 26px 40px; overflow-y: auto; overflow-x: hidden;
    transform: translateX(100%); transition: transform .22s ease; z-index: 20;
    box-shadow: -20px 0 60px rgba(0,0,0,.5);
  }
  #drawer.open { transform: translateX(0); }
  #drawer h2 { margin: 0 0 4px; font-size: 20px; }
  #drawer dl { display: grid; grid-template-columns: 130px 1fr; gap: 8px 14px; margin: 18px 0; }
  #drawer dt { color: var(--muted); font-size: 12.5px; }
  #drawer dd { margin: 0; word-break: break-all; }
  #close { position: absolute; top: 16px; right: 16px; background: var(--panel2); border: 1px solid var(--line); padding: 5px 11px; border-radius: 7px; }

  /* ---- gráfico de disponibilidade ---- */
  .hist-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 22px 0 10px; }
  .hist-head h3 { font-size: 13px; color: var(--muted); margin: 0; text-transform: uppercase; letter-spacing: .05em; }
  .range-sel { display: flex; gap: 4px; }
  .range-sel button {
    background: var(--panel2); border: 1px solid var(--line); color: var(--muted);
    font-size: 11.5px; padding: 4px 10px; border-radius: 6px; font-weight: 500;
  }
  .range-sel button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .range-sel button:hover:not(.active) { color: var(--text); border-color: #3a4150; }

  .hist-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .hs { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; }
  .hs .v { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .hs .k { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .hs.good .v { color: var(--ok); }
  .hs.bad .v { color: var(--bad); }

  .chart { position: relative; margin-top: 4px; }
  .chart-bars {
    display: flex; align-items: stretch; gap: 1px; height: 54px;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 4px;
  }
  .chart-bars i {
    flex: 1 1 0; min-width: 2px; border-radius: 2px; background: var(--ok);
    transition: filter .12s, transform .12s; cursor: default;
  }
  .chart-bars i.off { background: var(--bad); }
  .chart-bars i.nodata { background: #262b36; }
  .chart-bars i:hover { filter: brightness(1.45); }
  .chart-axis { display: flex; justify-content: space-between; margin-top: 5px; font-size: 10.5px; color: var(--muted); }
  .chart-legend { display: flex; gap: 14px; margin-top: 8px; font-size: 11px; color: var(--muted); }
  .chart-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .chart-legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
  .chart-empty { color: var(--muted); font-size: 12px; padding: 14px 0; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #333a47; border-radius: 6px; }
</style>
</head>
<body>
<header>
  <h1>Monitor VoIP <span id="subtitle">inventário de telefones IP</span></h1>
  <div class="spacer"></div>
  <div class="lastcheck">
    <span class="lc-label">Último monitoramento</span>
    <span class="lc-value" id="lastCheck">—</span>
  </div>
  <button id="btnMonitor">
    <span class="btn-spinner" id="spinner" hidden></span>
    <span id="btnLabel">Executar monitoramento</span>
  </button>
</header>

<div class="cards" id="cards"></div>

<div class="statusbar" id="statusbar" hidden>
  <div class="sb-left">
    <span class="sb-icon" id="sbIcon"></span>
    <div class="sb-text">
      <strong id="sbTitle"></strong>
      <span id="sbDetail"></span>
    </div>
  </div>
  <button class="sb-close" id="sbClose" title="fechar">×</button>
</div>

<div class="controls">
  <input type="search" id="q" placeholder="Buscar por ramal, setor, IP, MAC, modelo ou serial…">
  <select id="status">
    <option value="">Todos</option>
    <option value="online">Somente online</option>
    <option value="offline">Somente offline</option>
    <option value="instavel">⚠ Com instabilidade (caiu alguma vez)</option>
    <option value="estavel">Sem instabilidade registrada</option>
    <option value="sem-ramal">Sem ramal</option>
    <option value="sem-setor">Sem setor cadastrado</option>
  </select>
  <select id="setor">
    <option value="">Todos os setores</option>
  </select>
  <span class="muted" id="count"></span>
</div>

<div class="wrap">
  <table>
    <thead>
      <tr>
        <th data-k="online">Status <span class="arw"></span></th>
        <th data-k="ramal">Ramal <span class="arw"></span></th>
        <th data-k="setores">Setor <span class="arw"></span></th>
        <th data-k="quedas">Quedas <span class="arw"></span></th>
        <th data-k="ip">IP <span class="arw"></span></th>
        <th data-k="model">Modelo <span class="arw"></span></th>
        <th data-k="serial">Serial <span class="arw"></span></th>
        <th data-k="firmware">Firmware <span class="arw"></span></th>
        <th data-k="mac">MAC <span class="arw"></span></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" hidden>Nenhum aparelho encontrado.</div>
</div>

<div id="drawer">
  <button id="close">Fechar</button>
  <h2 id="dRamal">—</h2>
  <div class="muted" id="dIp"></div>
  <div class="hist-head">
    <h3>Disponibilidade</h3>
    <div class="range-sel" id="rangeSel">
      <button data-h="24" class="active">24h</button>
      <button data-h="72">3 dias</button>
      <button data-h="168">7 dias</button>
    </div>
  </div>
  <div class="hist-stats">
    <div class="hs good"><div class="v" id="stUptime">—</div><div class="k">Uptime</div></div>
    <div class="hs bad"><div class="v" id="stDrops">—</div><div class="k">Quedas</div></div>
    <div class="hs"><div class="v" id="stCoverage">—</div><div class="k">Cobertura</div></div>
  </div>
  <div class="chart">
    <div class="chart-bars" id="chartBars"></div>
    <div class="chart-axis"><span id="axStart">—</span><span id="axMid"></span><span id="axEnd">agora</span></div>
  </div>
  <div class="chart-legend">
    <span><i style="background:var(--ok)"></i>online</span>
    <span><i style="background:var(--bad)"></i>desaparecido</span>
    <span><i style="background:#262b36"></i>sem coleta</span>
  </div>
  <dl id="details"></dl>
</div>

<script>
let all = [];
let sortKey = 'ramal', sortDir = 1;

async function api(path, opts) {
  const r = await fetch(path, opts);
  return r.json();
}

function fmt(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleString('pt-BR', {
    day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit',
  });
}

function statusDot(r) {
  if (r.online === 0) {
    const when = r.missing_since ? ' desde ' + fmt(r.missing_since) : '';
    return `<span class="dot off"></span><span class="st-missing" title="não respondeu${when}">desaparecido</span>`;
  }
  if (r.online === 1) return '<span class="dot on"></span>online';
  return '<span class="dot unk"></span>não verificado';
}

/** Celula de quedas: 0 = discreto, 1+ = alerta com % de indisponibilidade. */
function quedasCell(r) {
  if (r.amostras == null) return '<span class="muted" title="sem historico">—</span>';
  if (!r.quedas) return '<span class="muted">0</span>';
  const pct = r.pct_indisponivel != null ? `${r.pct_indisponivel}%` : '';
  return `<span class="badge-queda" title="${r.amostras_offline} de ${r.amostras} ciclos sem resposta">${r.quedas}${pct ? `<span class="muted"> · ${pct}</span>` : ''}</span>`;
}

function render() {
  const q = document.getElementById('q').value.toLowerCase().trim();
  const st = document.getElementById('status').value;
  const setorSel = document.getElementById('setor').value;
  let rows = all.filter((r) => {
    if (q && ![r.ip, r.ramal, r.mac, r.model, r.hostname, r.serial, r.firmware, r.setores, r.andares, r.alas]
      .filter(Boolean).some((v) => String(v).toLowerCase().includes(q))) return false;
    if (st === 'online' && r.online !== 1) return false;
    if (st === 'offline' && r.online !== 0) return false;
    if (st === 'sem-ramal' && r.ramal) return false;
    if (st === 'sem-setor' && r.qtd_setores) return false;
    if (st === 'instavel' && r.em_instabilidade !== 1) return false;
    if (st === 'estavel' && r.em_instabilidade === 1) return false;
    if (setorSel && !(r.setores || '').split(' | ').includes(setorSel)) return false;
    return true;
  });

  rows.sort((a, b) => {
    let x = a[sortKey], y = b[sortKey];
    if (sortKey === 'ramal') { x = x ? +x : Infinity; y = y ? +y : Infinity; }
    if (sortKey === 'ip') {
      const toN = (ip) => ip.split('.').reduce((acc, o) => acc * 256 + +o, 0);
      x = toN(x); y = toN(y);
    }
    if (x == null) return 1; if (y == null) return -1;
    return (x > y ? 1 : x < y ? -1 : 0) * sortDir;
  });

  document.querySelectorAll('th').forEach((th) => {
    const arw = th.querySelector('.arw');
    if (arw) arw.textContent = th.dataset.k === sortKey ? (sortDir > 0 ? '▲' : '▼') : '';
  });

  document.getElementById('rows').innerHTML = rows.map((r, i) => `
    <tr data-i="${i}">
      <td>${statusDot(r)}</td>
      <td class="ramal">${r.ramal || '<span class="muted">—</span>'}</td>
      <td class="setor-cell" title="${r.setores || ''}${r.andares ? ' — ' + r.andares : ''}">
        ${r.setores
          ? r.setores.split(' | ').map((s) => `<span class="setor-tag">${s}</span>`).join('')
          : '<span class="muted">—</span>'}
      </td>
      <td>${quedasCell(r)}</td>
      <td class="mono">${r.ip}</td>
      <td>${r.model || '—'}</td>
      <td class="mono muted serial" title="${r.serial || ''}">${r.serial || '—'}</td>
      <td class="mono">${r.firmware || '—'}</td>
      <td class="mono muted">${r.mac || '—'}</td>
    </tr>`).join('');

  document.getElementById('count').textContent = `${rows.length} de ${all.length} aparelhos`;
  document.getElementById('empty').hidden = rows.length > 0;

  document.querySelectorAll('#rows tr').forEach((tr) => {
    tr.onclick = () => openDrawer(rows[+tr.dataset.i]);
  });
}

/* ================= grafico de disponibilidade ================= */
let currentIp = null;
let currentHours = 24;

function fmtShort(iso) {
  const d = new Date(iso);
  return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function fmtHourMin(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

/**
 * Monta uma serie no relogio dos ciclos (1 hora), marcando como "sem coleta"
 * os intervalos em que o monitoramento nao rodou.
 */
function buildSeries(samples, hours, stepHours) {
  const now = Date.now();
  const start = now - hours * 3600000;
  const stepMs = stepHours * 3600000;
  const buckets = [];
  const index = new Map();

  for (let t = start; t <= now; t += stepMs) {
    const key = Math.floor(t / stepMs);
    if (index.has(key)) continue;
    index.set(key, buckets.length);
    buckets.push({ t: new Date(t).toISOString(), state: 'nodata', sample: null });
  }

  for (const s of samples) {
    const key = Math.floor(new Date(s.created_at).getTime() / stepMs);
    const i = index.get(key);
    if (i !== undefined) {
      buckets[i].state = s.online === 1 ? 'on' : 'off';
      buckets[i].sample = s;
    }
  }
  return buckets;
}

function renderChart(buckets, stats, hours) {
  const bars = document.getElementById('chartBars');
  bars.innerHTML = buckets.map((b) => {
    const cls = b.state === 'on' ? '' : b.state === 'off' ? ' off' : ' nodata';
    const quando = b.sample ? fmtShort(b.sample.created_at) : fmtShort(b.t);
    const estado = b.state === 'on' ? 'online' : b.state === 'off' ? 'desaparecido' : 'sem coleta';
    const extra = b.sample?.ramal ? ` · ramal ${b.sample.ramal}` : '';
    return `<i class="${cls}" title="${quando} — ${estado}${extra}"></i>`;
  }).join('');

  const first = buckets[0];
  const last = buckets[buckets.length - 1];
  document.getElementById('axStart').textContent = first ? fmtShort(first.t) : '—';
  document.getElementById('axMid').textContent = buckets.length > 2
    ? fmtShort(buckets[Math.floor(buckets.length / 2)].t) : '';
  document.getElementById('axEnd').textContent = last ? fmtShort(last.t) : 'agora';

  document.getElementById('stUptime').textContent = stats.uptimePct != null ? stats.uptimePct + '%' : '—';
  document.getElementById('stUptime').style.color =
    stats.uptimePct == null ? '' : stats.uptimePct >= 99 ? 'var(--ok)' : stats.uptimePct >= 90 ? 'var(--warn)' : 'var(--bad)';
  document.getElementById('stDrops').textContent = stats.drops;
  document.getElementById('stDrops').style.color = stats.drops === 0 ? 'var(--muted)' : 'var(--bad)';
  document.getElementById('stCoverage').textContent =
    stats.coveragePct != null ? `${Math.min(100, stats.coveragePct)}%` : `${stats.total}/${stats.expected}`;
  document.getElementById('stCoverage').style.color =
    stats.coveragePct == null ? '' : stats.coveragePct >= 95 ? '' : 'var(--warn)';
}

async function loadHistory(ip, hours) {
  document.getElementById('chartBars').innerHTML = '<i class="nodata" style="flex:1"></i>';
  try {
    const h = await api(`/api/history/${encodeURIComponent(ip)}?hours=${hours}`);
    const buckets = buildSeries(h.samples, hours, h.step || 1);
    renderChart(buckets, h.stats, hours);
  } catch (e) {
    document.getElementById('chartBars').innerHTML = '';
    document.getElementById('axStart').textContent = 'erro ao carregar';
  }
}

document.getElementById('rangeSel').onclick = (e) => {
  const b = e.target.closest('button');
  if (!b || !currentIp) return;
  document.querySelectorAll('#rangeSel button').forEach((x) => x.classList.remove('active'));
  b.classList.add('active');
  currentHours = Number(b.dataset.h);
  loadHistory(currentIp, currentHours);
};

function openDrawer(r) {
  document.getElementById('dRamal').textContent = r.ramal ? `Ramal ${r.ramal}` : 'Sem ramal';
  document.getElementById('dIp').textContent = r.ip;

  // setores: um ramal pode estar em varios
  const partes = (r.setores || '').split(' | ');
  const andares = (r.andares || '').split(' | ');
  const alas = (r.alas || '').split(' | ');
  const setorHtml = r.setores
    ? partes.map((s, i) => {
        const extra = [andares[i], alas[i]].filter((x) => x && x !== '').join(' · ');
        return `<div style="margin-bottom:4px">${s}${extra ? ` <span class="muted" style="font-size:12px">(${extra})</span>` : ''}</div>`;
      }).join('')
    : '<span class="muted">não cadastrado na planilha</span>';

  const d = document.getElementById('details');
  const estab = r.amostras == null
    ? '<span class="muted">sem histórico coletado</span>'
    : (r.quedas > 0
        ? `<span class="badge-queda">${r.quedas} queda(s)</span> <span class="muted">· indisponível em ${r.pct_indisponivel}% dos ciclos (${r.amostras_offline}/${r.amostras})</span>`
        : `<span style="color:var(--ok)">estável</span> <span class="muted">· ${r.amostras} ciclos sem falha</span>`);

  d.innerHTML = [
    ['Setor', setorHtml],
    ['Estabilidade', estab],
    ['Modelo', r.model], ['Firmware', r.firmware], ['Serial', r.serial],
    ['MAC', r.mac], ['User-Agent SIP', r.sip_ua], ['Servidor HTTP', r.http_server],
    ['Portas', (() => { try { return JSON.parse(r.ports_json).join(', '); } catch { return '—'; } })()],
    ['Primeiro visto', fmt(r.first_seen)], ['Último contato', fmt(r.last_seen)],
    ...(r.online === 0 ? [['Desaparecido desde', fmt(r.missing_since)]] : []),
  ].map(([k, v]) => `<dt>${k}</dt><dd>${v === undefined || v === null ? '—' : v}</dd>`).join('');
  document.getElementById('drawer').classList.add('open');

  currentIp = r.ip;
  loadHistory(r.ip, currentHours);
}

document.getElementById('close').onclick = () => document.getElementById('drawer').classList.remove('open');

document.querySelectorAll('th').forEach((th) => {
  th.onclick = () => {
    if (sortKey === th.dataset.k) sortDir *= -1;
    else { sortKey = th.dataset.k; sortDir = 1; }
    render();
  };
});
document.getElementById('q').oninput = render;
document.getElementById('status').onchange = render;
document.getElementById('setor').onchange = render;

/* ================= status do monitoramento ================= */
const SB = {
  bar: document.getElementById('statusbar'),
  icon: document.getElementById('sbIcon'),
  title: document.getElementById('sbTitle'),
  detail: document.getElementById('sbDetail'),
};

function showStatus(kind, title, detail = '') {
  SB.bar.hidden = false;
  SB.bar.className = 'statusbar ' + kind;
  SB.title.textContent = title;
  SB.detail.textContent = detail;
}
function hideStatus() { SB.bar.hidden = true; }

document.getElementById('sbClose').onclick = hideStatus;

let monitorTimer = null;
let monitorStart = 0;

function setRunning(on) {
  const btn = document.getElementById('btnMonitor');
  btn.disabled = on;
  btn.classList.toggle('running', on);
  document.getElementById('spinner').hidden = !on;
  document.getElementById('btnLabel').textContent = on ? 'Monitorando…' : 'Executar monitoramento';
  clearInterval(monitorTimer);
  if (on) {
    monitorStart = Date.now();
    monitorTimer = setInterval(() => {
      const s = Math.floor((Date.now() - monitorStart) / 1000);
      SB.detail.textContent = `varrendo o range completo… ${s}s`;
    }, 200);
  }
}

/** Mensagem amigável para falhas do monitoramento. */
function describeError(err, httpStatus) {
  if (httpStatus === 401) return 'Sessão expirada. Recarregue a página e entre novamente.';
  if (httpStatus === 500) return 'O servidor encontrou um erro ao executar a varredura.';
  const m = String(err?.message || err || '');
  if (/Failed to fetch|NetworkError|ERR_CONNECTION/i.test(m)) {
    return 'Não foi possível falar com o servidor. Ele pode estar reiniciando — tente novamente em alguns segundos.';
  }
  return m || 'Falha desconhecida.';
}

async function runMonitor() {
  setRunning(true);
  showStatus('running', 'Monitoramento em andamento', 'varrendo o range completo… 0s');

  try {
    const res = await fetch('/api/monitor', { method: 'POST' });
    const data = await res.json().catch(() => ({}));

    if (!res.ok) {
      if (res.status === 409) {
        showStatus('warn', 'Já existe um monitoramento em andamento',
          'aguarde o término — a tela se atualiza sozinha');
        setRunning(true);
        pollUntilDone();
        return;
      }
      showStatus('err', 'O monitoramento falhou', describeError(data.error, res.status));
      return;
    }

    const partes = [];
    if (data.scanned) partes.push(`${data.scanned} IPs varridos`);
    partes.push(`${data.online} online`);
    if (data.novos?.length) partes.push(`${data.novos.length} novo(s)`);
    if (data.desaparecidos?.length) partes.push(`${data.desaparecidos.length} desaparecido(s)`);

    const tipo = (data.novos?.length || data.desaparecidos?.length) ? 'warn' : 'ok';
    const titulo = tipo === 'warn' ? 'Monitoramento concluído com mudanças' : 'Monitoramento concluído';
    const segs = data.durationMs != null ? (data.durationMs / 1000).toFixed(1) : null;
    const detalhe = partes.join(' · ') + (segs ? ` · ${segs}s` : '');

    if (data.novos?.length) {
      const lista = data.novos.map((n) => `ramal ${n.ramal || '?'} em ${n.ip}`).join(', ');
      showStatus(tipo, titulo, `${detalhe} — novos: ${lista}`);
    } else if (data.desaparecidos?.length) {
      const lista = data.desaparecidos.map((d) => `ramal ${d.ramal || '?'} (${d.ip})`).join(', ');
      showStatus(tipo, titulo, `${detalhe} — sumiram: ${lista}`);
    } else {
      showStatus(tipo, titulo, detalhe);
    }
  } catch (err) {
    showStatus('err', 'O monitoramento falhou', describeError(err));
  } finally {
    setRunning(false);
    await load();
  }
}

document.getElementById('btnMonitor').onclick = runMonitor;
document.getElementById('sbClose').onclick = hideStatus;

async function load() {
  const [phones, stats, scope] = await Promise.all([
    api('/api/phones'), api('/api/stats'), api('/api/scope').catch(() => ({ targets: [] })),
  ]);
  if (scope.targets?.length) {
    document.getElementById('subtitle').textContent = 'rede ' + scope.targets.join(' + ');
  }
  all = phones.rows;

  // preenche o filtro de setores (mantendo a selecao atual)
  const selSetor = document.getElementById('setor');
  const atual = selSetor.value;
  const nomes = [...new Set((phones.setores || []).map((s) => s.setor))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
  selSetor.innerHTML = '<option value="">Todos os setores</option>' +
    nomes.map((n) => `<option value="${n.replace(/"/g, '&quot;')}">${n}</option>`).join('');
  if (nomes.includes(atual)) selSetor.value = atual;

  const est = stats.estabilidade || {};
  document.getElementById('cards').innerHTML = `
    <div class="card"><div class="n">${stats.total}</div><div class="l">Telefones</div></div>
    <div class="card ok"><div class="n">${stats.online}</div><div class="l">Online</div></div>
    <div class="card bad"><div class="n">${stats.desaparecidos ?? stats.offline}</div><div class="l">Desaparecidos</div></div>
    <div class="card ${est.instaveis ? 'warn' : ''}" id="cardInstavel" style="cursor:pointer" title="Clique para filtrar">
      <div class="n">${est.instaveis ?? 0}</div><div class="l">Com instabilidade</div></div>
    <div class="card"><div class="n">${stats.comRamal}</div><div class="l">Com ramal</div></div>
    <div class="card"><div class="n">${stats.firmwares.length}</div><div class="l">Versões de firmware</div></div>`;

  // clicar no card aplica o filtro de instabilidade
  const card = document.getElementById('cardInstavel');
  if (card) {
    card.onclick = () => {
      const sel = document.getElementById('status');
      sel.value = sel.value === 'instavel' ? '' : 'instavel';
      render();
    };
  }
  document.getElementById('lastCheck').textContent = stats.ultimoCheck ? fmt(stats.ultimoCheck) : 'nunca';
  render();
  syncMonitorState();
}

/** Sincroniza a UI com o estado real do servidor (ex.: apos recarregar a pagina). */
async function syncMonitorState() {
  try {
    const st = await api('/api/monitor/status');
    if (st.running) {
      const secs = Math.round((st.elapsedMs || 0) / 1000);
      setRunning(true);
      showStatus('running', 'Monitoramento em andamento',
        `iniciado há ${secs}s — atualizando automaticamente ao terminar`);
      // acompanha ate terminar
      pollUntilDone();
      return;
    }
    if (st.lastError) {
      showStatus('err', 'O último monitoramento falhou',
        describeError(st.lastError.message) + ` (${fmt(st.lastError.at)})`);
    }
  } catch { /* servidor fora: nao bloqueia a UI */ }
}

let pollTimer = null;
function pollUntilDone() {
  clearTimeout(pollTimer);
  pollTimer = setTimeout(async () => {
    try {
      const st = await api('/api/monitor/status');
      if (st.running) {
        const secs = Math.round((st.elapsedMs || 0) / 1000);
        SB.detail.textContent = `iniciado há ${secs}s — aguarde, atualiza sozinho`;
        pollUntilDone();
      } else {
        await load();
      }
    } catch {
      pollUntilDone();
    }
  }, 1200);
}

load();
</script>
